# Idle and Sleep Configuration for Niri
# Waktu dalam detik (seconds)

# 1. Kunci layar (Lock Screen) setelah 3 menit (180 detik)
LOCK_TIMEOUT=180

# 2. Matikan layar laptop (Screen Off / DPMS) setelah 4 menit (240 detik = 1 menit setelah lockscreen)
SCREEN_OFF_TIMEOUT=240

# 3. Suspend / Sleep laptop setelah 15 menit (900 detik)
SUSPEND_TIMEOUT=900
