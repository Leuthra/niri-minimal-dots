# Catppuccin Mocha Hyprlock Configuration
# Integrated with Niri Wayland session

$mauve = rgb(cba6f7)
$lavender = rgb(b4befe)
$base = rgb(1e1e2e)
$surface0 = rgb(313244)
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$red = rgb(f38ba8)
$green = rgb(a6e3a1)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Realtime blurred desktop background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Digital Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $subtext
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
}

# User Greeting Label
label {
    monitor =
    text = 󰌾  Logged in as <b>$USER</b>
    color = $lavender
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8"><i>Enter password...</i></span>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <i>Authentication failed</i>
    fail_transition = 300
    capslock_color = $red
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}
