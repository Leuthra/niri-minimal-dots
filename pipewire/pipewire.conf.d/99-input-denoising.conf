# PipeWire filter chain for RNNoise voice noise suppression (LADSPA)
# Removes keyboard clicks, fan noise, and background noise from microphone input

context.modules = [
{
    name = libpipewire-module-filter-chain
    args = {
        node.description = "Noise Canceling Source"
        media.name       = "Noise Canceling Source"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = rnnoise
                    plugin = "librnnoise_ladspa"
                    label  = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)" = 85.0
                        "VAD Grace Period (ms)" = 200
                    }
                }
            ]
        }
        capture.props = {
            node.name = "capture.rnnoise_source"
            node.passive = true
            audio.rate = 48000
        }
        playback.props = {
            node.name = "rnnoise_source"
            media.class = Audio/Source
            audio.rate = 48000
        }
    }
}
]
